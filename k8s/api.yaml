# The API: it keeps the items on disk, so it is a StatefulSet with its own volume.
# Docker equivalent: docker run --name api -v demo-c5-datos:/data demo-c5-api:v1
apiVersion: v1
kind: Service
metadata:
  name: api            # the name nginx uses in proxy_pass http://api:8080/
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api
spec:
  serviceName: api
  replicas: 1          # one disk, one list: with 2 replicas each one would have its own disk
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Prefer the GCP VMs: the disk is created on the node where the Pod first lands
      # and stays there. Soft rule, so k3d (without zones) still works.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["us-central1-a"]
      securityContext:
        fsGroup: 1000  # the app runs as uid 1000: the new disk has to be writable for it
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/project-4c4f803f-f2a7-4566-9fe/demo-c5/api:v1
          imagePullPolicy: Always   # same tag re-pushed while preparing: always fetch it again
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  # The -v of docker run: Kubernetes asks for the disk (PVC) and the cluster creates it.
  # The free-k3s cluster has no default StorageClass: without this line the PVC stays Pending.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
